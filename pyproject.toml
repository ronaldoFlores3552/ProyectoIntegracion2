[project]
name = "proyecto-integrador-2"
version = "0.1.0"
description = "Análisis de grafos, clustering y representaciones sobre contrataciones públicas del Perú"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

